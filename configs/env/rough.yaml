# Rough-terrain overlay. Inherits env/base.yaml.
# Layer with: OmegaConf.merge(base, rough)
#
# WARNING: the terrain block below is DECLARED BUT IGNORED (see the note on it).
# This file's only real effect today is inheriting base.yaml unchanged, so it is
# byte-for-byte the upstream Rough-v0 task. In particular rough.yaml vs
# slippery.yaml is NOT a terrain contrast: both run base.yaml's Rough-v0 task on
# the same upstream generated terrain and differ only in
# domain_randomization.friction_range / restitution_range. Any past result read
# as "rough vs slippery terrain" was really "high friction vs low friction".

defaults:
  - base

# UNWIRED AND IGNORED. Nothing reads this block: go2_env_cfg.py lists
# ``terrain`` in _UNWIRED_TOP_LEVEL and build_env_cfg only warns about it.
# Terrain is chosen entirely by env.task_name. The stairs / slope / obstacle
# mix below is NOT what runs: Rough-v0 builds Isaac Lab's ROUGH_TERRAINS_CFG
# (5x5 grid, curriculum off) via velocity_env_cfg.py + go2/rough_env_cfg.py.
# Kept as the spec a future sim-validated wiring PR should implement.
terrain:
  type: "generator"
  size: [8.0, 8.0]
  num_rows: 10
  num_cols: 20
  horizontal_scale: 0.1
  vertical_scale: 0.005
  border_size: 20.0
  use_cache: false
  difficulty_range: [0.0, 1.0]
  sub_terrains:
    pyramid_stairs:
      proportion: 0.2
      step_height_range: [0.05, 0.20]
      step_width: 0.3
    rough:
      proportion: 0.3
      noise_range: [0.02, 0.10]
    slope:
      proportion: 0.2
      slope_range: [0.0, 0.4]
    discrete_obstacles:
      proportion: 0.3
      obstacle_height_range: [0.05, 0.15]
