# Base GO2 locomotion environment config.
# Layer specific overlays (rough.yaml, slippery.yaml, perturbation.yaml) on top.
#
# NOT ALL SECTIONS ARE WIRED (2026-04-17 audit, list refreshed 2026-09-11).
# go2_env_cfg.py's module docstring is authoritative; this header tracks it.
# Currently applied to the Isaac Lab env cfg:
#   env, command, domain_randomization (friction / restitution / mass /
#   motor_strength_scale / actuator_latency_steps), reward, observation.noise,
#   action.rate_limit, seed, and perturbation.enabled / push_velocity_xy /
#   push_velocity_yaw only.
# Present below but NOT applied (upstream UnitreeGo2RoughEnvCfg defaults win):
#   observation.include, termination, robot.init_state, robot.actuator,
#   perturbation.push_interval_s / push_warmup_s / push_probability
# Declared by the overlays but NOT applied: terrain. Terrain is chosen solely
#   by env.task_name (Rough-v0 -> generated rough terrain, Flat-v0 -> plane);
#   see _warn_dropped_terrain in go2_env_cfg.py.
# ``build_env_cfg`` logs a warning when it sees an unwired section, or an
# unapplied key inside a wired section, in a loaded config. Unwired values are
# documentation-only until the wiring is added (deliberate PR: changing any of
# these invalidates v3b reproducibility), so they must still state the values
# training REALLY uses. A number nothing runs still gets copied: the hip pose
# below claimed 0.0, and the deploy configs were written against it until
# commit 72d0457 had to correct every one of them.

env:
  # Task: command-conditioned velocity tracking.
  task_name: "Isaac-Velocity-Rough-Unitree-Go2-v0"  # Isaac Lab registered task id
  num_envs: 4096
  episode_length_s: 20.0
  decimation: 4           # 200 Hz sim → 50 Hz control
  sim_dt: 0.005           # 200 Hz physics

robot:
  name: "unitree_go2"
  usd_path: "{ISAAC_NUCLEUS_DIR}/Robots/Unitree/Go2/go2.usd"

  # UNWIRED AND IGNORED. go2_env_cfg.py lists robot.init_state in
  # _UNWIRED_ROBOT_SUB, so nothing below is ever pushed into the env cfg;
  # training uses IsaacLab's UNITREE_GO2_CFG.init_state verbatim
  # (isaaclab_assets/robots/unitree.py, ArticulationCfg.init_state).
  # The values below are therefore kept IDENTICAL to that upstream pose, so
  # that reading this file tells the truth and a future wiring PR would wire
  # to the pose the policies were actually trained on.
  # Corrected 2026-09-11: this block used to claim ".*_hip_joint": 0.0, a pose
  # training has never used, and the deploy configs copied that 0.0 until commit
  # 72d0457 corrected them.
  init_state:
    base_pos: [0.0, 0.0, 0.4]
    base_rot: [1.0, 0.0, 0.0, 0.0]   # quat (w,x,y,z)
    joint_pos:
      # Upstream nominal standing pose. Hips are NOT zero: left +0.1, right -0.1
      # (regex keys mirror UNITREE_GO2_CFG, ".*L" = FL and RL, ".*R" = FR and RR).
      ".*L_hip_joint": 0.1
      ".*R_hip_joint": -0.1
      "FL_thigh_joint": 0.8
      "FR_thigh_joint": 0.8
      "RL_thigh_joint": 1.0
      "RR_thigh_joint": 1.0
      ".*_calf_joint": -1.5

  # UNWIRED AND IGNORED (robot.actuator is in _UNWIRED_ROBOT_SUB). Training uses
  # UNITREE_GO2_CFG's DCMotorCfg: stiffness 25.0, damping 0.5, effort_limit 23.5,
  # saturation_effort 23.5, velocity_limit 30.0. velocity_limit below is the Go2
  # datasheet figure, NOT the value the sim runs; it is left as-is because no
  # trained policy depends on it, but do not copy it into a deploy config.
  actuator:
    stiffness: 25.0
    damping: 0.5
    velocity_limit: 21.0
    effort_limit: 23.5

command:
  # Velocity command ranges sampled per episode.
  lin_vel_x: [-1.0, 1.0]      # m/s
  lin_vel_y: [-0.6, 0.6]
  ang_vel_z: [-1.0, 1.0]      # rad/s
  heading_stiffness: 0.5
  resample_time_s: 10.0
  # Fraction of envs per episode that get cmd=(0,0,0). Without this,
  # canonical stand is OOD and the policy extrapolates to huge actions
  # (retrain v1/v2 canonical-stand |a|∞ was 10.72 / 7.89 vs 0.3 target).
  rel_standing_envs: 0.02

observation:
  # Proprioceptive-only policy.
  include:
    - base_lin_vel
    - base_ang_vel
    - projected_gravity
    - velocity_command
    - joint_pos
    - joint_vel
    - last_action
  noise:
    joint_pos: 0.01
    joint_vel: 1.5
    base_lin_vel: 0.1
    base_ang_vel: 0.2
    projected_gravity: 0.05

domain_randomization:
  enabled: true
  friction_range: [0.3, 1.5]
  restitution_range: [0.0, 0.5]
  mass_offset_kg: [-2.0, 2.0]
  # WIRED 2026-06-16. motor_strength_scale scales the explicit DCMotor actuator
  # gains per-env at startup via scale_explicit_actuator_gains (the built-in
  # randomize_actuator_gains zeroes explicit-actuator gains, see that function).
  # actuator_latency_steps is stored on env_cfg for a future action-delay buffer
  # (declared, not yet consumed). Wiring these invalidates the v3b repro.
  motor_strength_scale: [0.85, 1.15]
  actuator_latency_steps: [1, 5]   # at 200 Hz, 5-25 ms

perturbation:
  # Applied at episode RESET, not on an interval: go2_env_cfg._apply_perturbation
  # modulates the upstream reset-mode ``base_external_force_torque`` event. The
  # interval pusher (``push_robot``) is set to None by the Go2 events cfg, so
  # nothing shoves the robot mid-episode.
  enabled: false      # overlay enables this
  push_velocity_xy: 1.0
  push_velocity_yaw: 0.5
  # UNWIRED AND IGNORED (flagged as perturbation.push_interval_s by
  # _unwired_sections_present): there is no interval event to attach it to.
  push_interval_s: 7.0

reward:
  # Applied via go2_env_cfg._apply_rewards. Only upstream
  # UnitreeGo2RoughEnvCfg reward term names are accepted — see
  # phoenix.sim_env.go2_env_cfg._REWARD_TERM_MAP. Removed 2026-04-19:
  # base_height, joint_vel, collision, termination (no upstream term;
  # aspirational pre-wiring).
  track_lin_vel_xy: 1.0
  track_ang_vel_z: 0.5
  ang_vel_xy: -0.05
  lin_vel_z: -2.0
  joint_acc: -2.5e-7
  joint_torque: -0.0002
  action_rate: -0.05
  feet_air_time: 1.0

termination:
  base_contact: true
  pitch_threshold_rad: 0.8
  roll_threshold_rad: 0.6
  base_height_min: 0.15

seed: 42
