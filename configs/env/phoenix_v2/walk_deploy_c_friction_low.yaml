# Phase 9 condition C held-out friction 0.2 (training 0.3 to 1.5) (amendment 9). Exact deploy stack around Isaac Lab:
# the env's own soft limiter is OFF, the deploy ActuatorGate is the only limiter.
defaults:
  - walk_w1
action:
  rate_limit:
    enabled: false
domain_randomization:
  enabled: true
  friction_range: [0.2, 0.2]
  restitution_range: [0.0, 0.0]
  mass_offset_kg: [0.0, 0.0]
  motor_strength_scale: [1.0, 1.0]
  actuator_latency_steps: [1, 5]
