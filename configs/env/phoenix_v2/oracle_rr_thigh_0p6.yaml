# Arm A4 (ablation, not a deployable method): the targeted distribution centred on
# the TRUE applied scale instead of the monitor's estimate. Isolates estimator error
# from the value of targeting. PLACEHOLDER for s_train = 0.6: per EXPERIMENT.md the
# centre is s_train and the width is the median width of the A3 overlays, both fixed
# after the A3 overlays are built and before any arm trains.
defaults:
  - ../stand_v3_h25
domain_randomization:
  targeted_actuator:
    nominal_fraction: 0.5
    scale_damping: true
    joints:
      RR_thigh_joint: [0.52, 0.68]
