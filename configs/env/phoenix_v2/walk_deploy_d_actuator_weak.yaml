# Phase 9 condition D held-out actuator scale 0.75 (training 0.85 to 1.15) (amendment 9). Exact deploy stack around Isaac Lab:
# the env's own soft limiter is OFF, the deploy ActuatorGate is the only limiter.
defaults:
  - walk_w1
action:
  rate_limit:
    enabled: false
domain_randomization:
  enabled: true
  friction_range: [0.8, 0.8]
  restitution_range: [0.0, 0.0]
  mass_offset_kg: [0.0, 0.0]
  motor_strength_scale: [0.75, 0.75]
  actuator_latency_steps: [1, 5]
