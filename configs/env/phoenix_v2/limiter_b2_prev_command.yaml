# Phase B2: same policy and distribution, CANDIDATE command-rate limiter:
# |sent[k] - sent[k-1]| <= max_delta_per_step (0.175 rad/step = 8.75 rad/s at 50 Hz).
# Phase C sweeps max_delta_per_step with --override files built from this one.
defaults:
  - ../stand_v3_h25
action:
  rate_limit:
    enabled: true
    clip_mode: prev_command
    max_delta_per_step: 0.175
