# Deployment config for the stand-v2 specialist on the real GO2.
#
# Stand-v1 (bit-identical to phoenix-flat) saturated the ±0.175 rad/step
# slew clip on 30.23% of motor-steps on hardware 2026-04-18 (need <5%).
# Stand-v2 retrained on the workstation 2026-04-19 with action_rate=-0.5 (10x) and
# joint_acc=-1.0e-6 (4x). The ONNX was re-exported on the Jetson
# 2026-04-20 from latest.pt after the original export was discovered to
# be a byte-copy of flat's export.
#
# Deploy identical to deploy.yaml except policy paths.

policy:
  onnx_path: "checkpoints/phoenix-stand-v3/policy.onnx"
  torchscript_path: "checkpoints/phoenix-stand-v3/policy.pt"
  device: "cpu"
  obs_pad_zeros: 0

control:
  rate_hz: 50
  action_scale: 0.25
  # Copied from the training asset: IsaacLab UNITREE_GO2_CFG.init_state in
  # isaaclab_assets/robots/unitree.py. The hips are not zero. Since the action
  # term is configured with use_default_offset=True, this pose drives both the
  # action offset and joint_pos_rel in the observation, so the policy sees any
  # deviation from the training value on every single tick.
  default_joint_pos:
    FL_hip_joint: 0.1
    FR_hip_joint: -0.1
    RL_hip_joint: 0.1
    RR_hip_joint: -0.1
    FL_thigh_joint: 0.8
    FR_thigh_joint: 0.8
    RL_thigh_joint: 1.0
    RR_thigh_joint: 1.0
    FL_calf_joint: -1.5
    FR_calf_joint: -1.5
    RL_calf_joint: -1.5
    RR_calf_joint: -1.5

joint_order:
  - "FL_hip_joint"
  - "FR_hip_joint"
  - "RL_hip_joint"
  - "RR_hip_joint"
  - "FL_thigh_joint"
  - "FR_thigh_joint"
  - "RL_thigh_joint"
  - "RR_thigh_joint"
  - "FL_calf_joint"
  - "FR_calf_joint"
  - "RL_calf_joint"
  - "RR_calf_joint"

topics:
  imu: "/imu/data"
  joint_states: "/joint_states"
  cmd_vel: "/cmd_vel"
  joint_command: "/joint_group_position_controller/command"

safety:
  emergency_stop_topic: "/phoenix/estop"
  dead_mans_switch: true
  max_runtime_s: 120
  estop_timeout_s: 0.5
  sensor_timeout_s: 0.2
  # first_message_timeout_s replaces the old startup_grace_s wallclock gate.
  # cyclonedds discovery on the Jetson routinely takes >3 s; 15 s gives a
  # generous first-message window without masking real publisher failures.
  # Once every required topic has delivered one message, steady-state
  # freshness reverts to the canonical estop/sensor timeouts above.
  first_message_timeout_s: 15.0

# Which source supplies the body linear velocity the POLICY consumes. There is
# deliberately no default: base_lin_vel is a TRAINED observation term, and a
# silent zero for a trained feature is the defect this key exists to prevent.
#   zeros : feed zeros, as every run before 2026-09-11 did. Reproduces historical
#           behaviour exactly and is the calibration the shield artifact was fit in.
#   odom  : use validated /utlidar/robot_odom body twist. HARDWARE-UNVERIFIED and
#           NOT the input distribution any shipped checkpoint was trained against.
observation:
  base_lin_vel_source: zeros
