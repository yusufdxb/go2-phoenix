# Deployment config for stand-v3 WITH the runtime reliability shield.
#
# Identical to deploy_stand_v3.yaml except that the policy ONNX is the
# latent-emitting export and the `reliability` block is enabled. Use this
# config for the August CaresLab shield runs; use deploy_stand_v3.yaml for
# an unshielded baseline run of the same policy.
#
# The policy ONNX MUST be exported with --emit-latent:
#
#   python -m phoenix.sim2real.export \
#     --checkpoint checkpoints/phoenix-stand-v3-h25-final/latest.pt \
#     --output deploy/stand_v3_latent.onnx --emit-latent --verify
#
# and the artifact/policy pair MUST pass the end-to-end gate before it goes
# near the robot:
#
#   python scripts/reliability_verify_deploy.py \
#     --onnx deploy/stand_v3_latent.onnx --artifact deploy/shield_stand_v3.npz
#
# The node fails closed at construction if the ONNX has no `latent` output or
# if its width disagrees with the artifact.

policy:
  onnx_path: "deploy/stand_v3_latent.onnx"
  torchscript_path: "deploy/stand_v3_latent.pt"
  device: "cpu"
  obs_pad_zeros: 0

reliability:
  enabled: true
  artifact: "deploy/shield_stand_v3.npz"
  # NOTHING else is settable here. Threshold, persistence K, arming window,
  # ramps and release policy are all frozen inside the artifact, because they
  # were calibrated together and each of them changes the outcome. The node
  # REFUSES to start if any of them appear in this block. To change one, refit:
  #   scripts/reliability_fit_deploy.py --handoff-ticks ... --latch/--no-latch
  # Current artifact: trip 6385.4, K=3, arming 15 ticks, handoff 10, latch true.

control:
  rate_hz: 50
  action_scale: 0.25
  # Same pose as the unshielded config, and for the same reason: it is the
  # training default from IsaacLab UNITREE_GO2_CFG.init_state in
  # isaaclab_assets/robots/unitree.py, and use_default_offset=True makes it the
  # action offset and the observation reference. It matters twice over here,
  # because the shield blends the learned target toward this same vector, so a
  # wrong pose is also a wrong fallback target.
  default_joint_pos:
    FL_hip_joint: 0.1
    FR_hip_joint: -0.1
    RL_hip_joint: 0.1
    RR_hip_joint: -0.1
    FL_thigh_joint: 0.8
    FR_thigh_joint: 0.8
    RL_thigh_joint: 1.0
    RR_thigh_joint: 1.0
    FL_calf_joint: -1.5
    FR_calf_joint: -1.5
    RL_calf_joint: -1.5
    RR_calf_joint: -1.5

joint_order:
  - "FL_hip_joint"
  - "FR_hip_joint"
  - "RL_hip_joint"
  - "RR_hip_joint"
  - "FL_thigh_joint"
  - "FR_thigh_joint"
  - "RL_thigh_joint"
  - "RR_thigh_joint"
  - "FL_calf_joint"
  - "FR_calf_joint"
  - "RL_calf_joint"
  - "RR_calf_joint"

topics:
  imu: "/imu/data"
  joint_states: "/joint_states"
  cmd_vel: "/cmd_vel"
  joint_command: "/joint_group_position_controller/command"
  # [blend, raw_score, trip_threshold, state_code] per control tick.
  shield_status: "/phoenix/shield"

safety:
  emergency_stop_topic: "/phoenix/estop"
  dead_mans_switch: true
  max_runtime_s: 120
  estop_timeout_s: 0.5
  sensor_timeout_s: 0.2
  first_message_timeout_s: 15.0

# Which source supplies the body linear velocity the POLICY consumes. There is
# deliberately no default: base_lin_vel is a TRAINED observation term, and a
# silent zero for a trained feature is the defect this key exists to prevent.
#   zeros : feed zeros, as every run before 2026-09-11 did. Reproduces historical
#           behaviour exactly and is the calibration the shield artifact was fit in.
#   odom  : use validated /utlidar/robot_odom body twist. HARDWARE-UNVERIFIED and
#           NOT the input distribution any shipped checkpoint was trained against.
observation:
  base_lin_vel_source: zeros
