# Deployment config for the FULLY-HARDENED stand-v3-h25 deliverable on the real GO2.
#
# Transfer-hardened stand policy with all four sim-to-real layers active in
# training: (1) per-step rate limiter inside the MDP (sim == the Jetson +/-0.175
# rad/step cap vs measured q, no train/deploy mismatch), (2) motor-strength gain
# DR, (3) DelayedDCMotor actuator latency [1,5] physics steps, (4) observation
# noise (enable_corruption: noisy IMU/encoder obs). It is trained against the
# disturbances the real robot actually has, which is the point, not the lowest
# clean-sim number.
#
# Verified 2026-06-23 (checkpoints/phoenix-stand-h25-lat-noise/, model_799):
#   nominal (stand_nodr):    32/32 stand, 20 s episodes, slew 3.65%
#   full DR (stand_v3_h25):  32/32 stand, 20 s episodes, slew 4.23%   (gate <5%)
#   ONNX parity: max torch<->onnx abs diff 5.722e-06   (gate <1e-5) PASS
#
# MARGIN NOTE: slew is higher than the limiter-only policy (2.40/3.47%) because
# this one trains under latency+noise. 4.23% under DR is the honest worst case and
# leaves less headroom to the 5% gate; if the live number is tight, dial back the
# DR (actuator_latency_steps / observation.noise) rather than the limiter.
#
# WATCH AT LAB: the limiter slows posture leveling (slightly slower settle than a
# Sport-mode stand); never falls in sim. Test FEET-ON-GROUND, not on a fixture
# (the fixture is a degenerate/OOD test, see the lab-card).
#
# Supersedes phoenix-stand-h25-ratelimit, phoenix-stand-v3-h25-final, deploy_stand_v3.yaml.
#
# DEPLOY NOTE: the export is external-data format. BOTH policy.onnx AND
# policy.onnx.data must ship to the Jetson, in the same directory. onnxruntime
# resolves the .data file relative to the .onnx path automatically.

policy:
  onnx_path: "checkpoints/phoenix-stand-h25-lat-noise/policy.onnx"
  torchscript_path: "checkpoints/phoenix-stand-h25-lat-noise/policy.pt"
  device: "cpu"
  obs_pad_zeros: 0

control:
  rate_hz: 50
  action_scale: 0.25
  # MUST equal the training default_joint_pos (IsaacLab unitree.py GO2 init_state),
  # because use_default_offset=True makes this the action offset AND the
  # joint-relative observation reference. The previous deploy configs set all
  # hips to 0.0, but training uses L=+0.1 / R=-0.1, a constant 0.1 rad hip
  # offset the policy never saw (off-distribution obs + offset on all 4 hips).
  default_joint_pos:
    FL_hip_joint: 0.1
    FR_hip_joint: -0.1
    RL_hip_joint: 0.1
    RR_hip_joint: -0.1
    FL_thigh_joint: 0.8
    FR_thigh_joint: 0.8
    RL_thigh_joint: 1.0
    RR_thigh_joint: 1.0
    FL_calf_joint: -1.5
    FR_calf_joint: -1.5
    RL_calf_joint: -1.5
    RR_calf_joint: -1.5

joint_order:
  - "FL_hip_joint"
  - "FR_hip_joint"
  - "RL_hip_joint"
  - "RR_hip_joint"
  - "FL_thigh_joint"
  - "FR_thigh_joint"
  - "RL_thigh_joint"
  - "RR_thigh_joint"
  - "FL_calf_joint"
  - "FR_calf_joint"
  - "RL_calf_joint"
  - "RR_calf_joint"

topics:
  imu: "/imu/data"
  joint_states: "/joint_states"
  cmd_vel: "/cmd_vel"
  joint_command: "/joint_group_position_controller/command"

safety:
  emergency_stop_topic: "/phoenix/estop"
  dead_mans_switch: true
  max_runtime_s: 120
  estop_timeout_s: 0.5
  sensor_timeout_s: 0.2
  # first_message_timeout_s replaces the old startup_grace_s wallclock gate.
  # cyclonedds discovery on the Jetson routinely takes >3 s; 15 s gives a
  # generous first-message window without masking real publisher failures.
  # Once every required topic has delivered one message, steady-state
  # freshness reverts to the canonical estop/sensor timeouts above.
  first_message_timeout_s: 15.0
